<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibraSys</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-badge {
        0%, 100% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.4); }
        50%       { box-shadow: 0 0 0 8px rgba(25, 135, 84, 0); }
      }
      @keyframes shimmer {
        0%   { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-10px); }
      }
      @keyframes gradientShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes countUp {
        from { opacity: 0; transform: scale(0.5); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes rowIn {
        from { opacity: 0; transform: translateX(-20px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .fade-in-up   { animation: fadeInUp 0.5s ease forwards; }
      .pulse-active { animation: pulse-badge 2s infinite; }
      .float-anim   { animation: float 3s ease-in-out infinite; }
      .stat-num     { animation: countUp 0.6s cubic-bezier(.175,.885,.32,1.275) forwards; }
      .row-anim     { animation: rowIn 0.4s ease forwards; }
      .gradient-hero {
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #533483);
        background-size: 400% 400%;
        animation: gradientShift 8s ease infinite;
      }
      .card-hover {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
      }
      .card-hover:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
      }
      .dewey-badge {
        font-family: 'Courier New', monospace;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .search-animated {
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }
      .search-animated:focus {
        border-color: #6c5ce7;
        box-shadow: 0 0 0 0.2rem rgba(108,92,231,0.25);
        transform: scale(1.01);
      }
      .btn-animate {
        transition: all 0.25s ease;
      }
      .btn-animate:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      }
      .table-row-hover tbody tr {
        transition: background 0.2s, transform 0.2s;
      }
      .table-row-hover tbody tr:hover {
        background: rgba(108,92,231,0.07) !important;
        transform: scale(1.005);
      }
      .category-card-glow {
        border: none;
        border-radius: 16px;
        overflow: hidden;
        transition: all 0.35s cubic-bezier(.175,.885,.32,1.275);
        position: relative;
      }
      .category-card-glow::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.3s ease;
        background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      }
      .category-card-glow:hover::before { opacity: 1; }
      .category-card-glow:hover {
        transform: translateY(-12px) scale(1.03);
        box-shadow: 0 25px 50px rgba(0,0,0,0.25) !important;
      }
      .toast-container { z-index: 9999; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
